    <main>
       

        <section class="destinations" aria-labelledby="destinations-title">
            <div class="destinations-heading">
                <div>
                    <h2 id="destinations-title">Search for your preferred destination</h2>
                </div>
               
            </div>

            <!--Submitting the form also lets visitors search with the Enter key-->
            <form class="search-form" role="search" onsubmit="searchTrip(); return false;">
                <label for="search">Where would you like to go?</label>
                <div class="search-controls">
                    <input type="search" id="search" placeholder="Search by city, country, or continent.">
                    <button type="submit" id="search_button">Search</button>
                </div>
            </form>

            <div class="results-heading" id="favorites">
                <h3 id="results-title">Destinations</h3>
                <p id="results" aria-live="polite"></p>
            </div>
            <noscript>Enable JavaScript to view and search destinations.</noscript>

            <!--The script fills these cards with the matching destinations-->
            <div class="explore-cards">
                <article id="A" class="element" hidden>
                    <img class="cardimage" id="imageA" alt="">
                    <div class="textcontainer">
                        <h3 id="titleA"></h3>
                        <p id="detailsA"></p>
                    </div>
                    <div class="buttoncontainer">
                        <button type="button" class="book-button" id="bookButtonA" aria-describedby="titleA" onclick="bookTrip(0)"></button>
                        <button type="button" class="favorite-button" id="favButtonA" aria-describedby="titleA" onclick="addToFavorites(0)"></button>
                    </div>
                </article>
                <article id="B" class="element" hidden>
                    <img class="cardimage" id="imageB" alt="">
                    <div class="textcontainer">
                        <h3 id="titleB"></h3>
                        <p id="detailsB"></p>
                    </div>
                    <div class="buttoncontainer">
                        <button type="button" class="book-button" id="bookButtonB" aria-describedby="titleB" onclick="bookTrip(1)"></button>
                        <button type="button" class="favorite-button" id="favButtonB" aria-describedby="titleB" onclick="addToFavorites(1)"></button>
                    </div>
                </article>
                <article id="C" class="element" hidden>
                    <img class="cardimage" id="imageC" alt="">
                    <div class="textcontainer">
                        <h3 id="titleC"></h3>
                        <p id="detailsC"></p>
                    </div>
                    <div class="buttoncontainer">
                        <button type="button" class="book-button" id="bookButtonC" aria-describedby="titleC" onclick="bookTrip(2)"></button>
                        <button type="button" class="favorite-button" id="favButtonC" aria-describedby="titleC" onclick="addToFavorites(2)"></button>
                    </div>
                </article>
                <article id="D" class="element" hidden>
                    <img class="cardimage" id="imageD" alt="">
                    <div class="textcontainer">
                        <h3 id="titleD"></h3>
                        <p id="detailsD"></p>
                    </div>
                    <div class="buttoncontainer">
                        <button type="button" class="book-button" id="bookButtonD" aria-describedby="titleD" onclick="bookTrip(3)"></button>
                        <button type="button" class="favorite-button" id="favButtonD" aria-describedby="titleD" onclick="addToFavorites(3)"></button>
                    </div>
                </article>
                <article id="E" class="element" hidden>
                    <img class="cardimage" id="imageE" alt="">
                    <div class="textcontainer">
                        <h3 id="titleE"></h3>
                        <p id="detailsE"></p>
                    </div>
                    <div class="buttoncontainer">
                        <button type="button" class="book-button" id="bookButtonE" aria-describedby="titleE" onclick="bookTrip(4)"></button>
                        <button type="button" class="favorite-button" id="favButtonE" aria-describedby="titleE" onclick="addToFavorites(4)"></button>
                    </div>
                </article>
                <article id="F" class="element" hidden>
                    <img class="cardimage" id="imageF" alt="">
                    <div class="textcontainer">
                        <h3 id="titleF"></h3>
                        <p id="detailsF"></p>
                    </div>
                    <div class="buttoncontainer">
                        <button type="button" class="book-button" id="bookButtonF" aria-describedby="titleF" onclick="bookTrip(5)"></button>
                        <button type="button" class="favorite-button" id="favButtonF" aria-describedby="titleF" onclick="addToFavorites(5)"></button>
                    </div>
                </article>
            </div>
        </section>
